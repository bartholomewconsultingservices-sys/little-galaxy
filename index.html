<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#0a1032"><title>Little Galaxy</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080d29;touch-action:none;font-family:system-ui,sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none}.controls{position:fixed;top:max(12px,env(safe-area-inset-top));right:12px;display:flex;gap:8px}button{background:#ffffff1d;border:1px solid #ffffff55;color:white;border-radius:30px;padding:10px 13px;font-size:17px;backdrop-filter:blur(10px)}.hint{position:fixed;bottom:max(18px,env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:#ffffffa8;font-size:13px;pointer-events:none;transition:opacity 1s}</style></head><body><canvas id="sky" aria-label="Interactive floating colorful stars"></canvas><div class="controls"><button id="sound" aria-label="Toggle sound">♪ Off</button><button id="full" aria-label="Fullscreen">⛶</button></div><div class="hint" id="hint">Touch a star ✨</div><script>
const canvas=document.getElementById('sky'),ctx=canvas.getContext('2d');let w,h,dpr,stars=[],dust=[],sparkles=[],sound=false,audio;const colors=['#ffda68','#6edcff','#fa8edb','#a58bff','#7ff6b1','#ff9b74'];let last=0;
function rand(a,b){return a+Math.random()*(b-a)}function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);dust=Array.from({length:Math.min(170,Math.round(w*h/2400))},()=>({x:rand(0,w),y:rand(0,h),r:rand(.4,1.7),a:rand(.2,.75),p:rand(0,7)}));const count=Math.min(11,Math.max(6,Math.round(w*h/60000)));stars=Array.from({length:count},(_,i)=>({x:rand(55,Math.max(56,w-55)),y:rand(90,Math.max(91,h-90)),r:rand(23,35),vx:rand(-.35,.35),vy:rand(-.35,.35),color:colors[i%colors.length],phase:rand(0,7),glow:0}));}addEventListener('resize',resize);resize();
function starPath(x,y,r){ctx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rad=i%2?r*.49:r;const px=x+Math.cos(a)*rad,py=y+Math.sin(a)*rad;if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py)}ctx.closePath()}
function background(t){const g=ctx.createRadialGradient(w*.48,h*.48,20,w*.48,h*.48,Math.max(w,h)*.75);g.addColorStop(0,'#25205b');g.addColorStop(.55,'#11183f');g.addColorStop(1,'#070c23');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);const neb=ctx.createRadialGradient(w*.4,h*.53,0,w*.4,h*.53,Math.min(w,h)*.52);neb.addColorStop(0,'#c45dd41e');neb.addColorStop(1,'#c45dd400');ctx.fillStyle=neb;ctx.fillRect(0,0,w,h);for(const d of dust){ctx.globalAlpha=d.a*(.8+.2*Math.sin(t*.001+d.p));ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,7);ctx.fill()}ctx.globalAlpha=1}
function draw(t,dt){background(t);for(const s of stars){s.x+=s.vx*dt;s.y+=s.vy*dt;s.vx*=Math.pow(.997,dt);s.vy*=Math.pow(.997,dt);if(Math.abs(s.vx)<.12)s.vx+=(s.vx<0?-.006:.006)*dt;if(Math.abs(s.vy)<.12)s.vy+=(s.vy<0?-.006:.006)*dt;if(s.x<s.r+8){s.x=s.r+8;s.vx=Math.abs(s.vx)}if(s.x>w-s.r-8){s.x=w-s.r-8;s.vx=-Math.abs(s.vx)}if(s.y<s.r+12){s.y=s.r+12;s.vy=Math.abs(s.vy)}if(s.y>h-s.r-12){s.y=h-s.r-12;s.vy=-Math.abs(s.vy)}s.glow*=Math.pow(.96,dt);const rr=s.r*(1+.045*Math.sin(t*.002+s.phase));ctx.shadowColor=s.color;ctx.shadowBlur=22+s.glow*24;starPath(s.x,s.y,rr);ctx.fillStyle=s.color;ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='#ffffff9e';ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle='#202247';ctx.beginPath();ctx.arc(s.x-rr*.2,s.y-rr*.04,rr*.055,0,7);ctx.arc(s.x+rr*.2,s.y-rr*.04,rr*.055,0,7);ctx.fill();ctx.beginPath();ctx.arc(s.x,s.y+rr*.11,rr*.12,0,Math.PI);ctx.strokeStyle='#202247';ctx.lineWidth=1.7;ctx.stroke()}
for(let i=sparkles.length-1;i>=0;i--){const p=sparkles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;ctx.globalAlpha=Math.max(0,p.life/35);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();if(p.life<=0)sparkles.splice(i,1)}ctx.globalAlpha=1;requestAnimationFrame(loop)}function loop(t){let dt=Math.min((t-last)/16.67||1,2);last=t;draw(t,dt)}requestAnimationFrame(loop);
function chime(){if(!sound)return;try{audio??=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.setValueAtTime(rand(450,680),audio.currentTime);o.frequency.exponentialRampToValueAtTime(rand(680,940),audio.currentTime+.18);g.gain.setValueAtTime(.0001,audio.currentTime);g.gain.exponentialRampToValueAtTime(.055,audio.currentTime+.025);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+.45);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+.46)}catch(e){}}
function touch(x,y){let closest=null,best=Infinity;for(const s of stars){let dist=Math.hypot(x-s.x,y-s.y);if(dist<best){best=dist;closest=s}}if(!closest||best>closest.r+35)return;const s=closest;let dx=s.x-x,dy=s.y-y,mag=Math.hypot(dx,dy);if(mag<8){dx=rand(-1,1);dy=rand(-1,1);mag=Math.hypot(dx,dy)}s.vx=dx/mag*rand(1.2,2.1);s.vy=dy/mag*rand(1.2,2.1);s.glow=1;for(let i=0;i<14;i++){let a=rand(0,Math.PI*2),v=rand(.3,2);sparkles.push({x:s.x,y:s.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rand(17,35),r:rand(1,3),color:s.color})}chime();document.getElementById('hint').style.opacity='0'}canvas.addEventListener('pointerdown',e=>{touch(e.clientX,e.clientY)});canvas.addEventListener('pointermove',e=>{if(e.buttons)touch(e.clientX,e.clientY)});document.getElementById('sound').onclick=e=>{sound=!sound;e.currentTarget.textContent=sound?'♪ On':'♪ Off';if(sound)chime()};document.getElementById('full').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};
</script></body></html>
