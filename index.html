<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#090b2c"><meta name="apple-mobile-web-app-capable" content="yes"><title>Little Galaxy ✨</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090b2c;touch-action:none;font-family:system-ui,sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none}.controls{position:fixed;top:max(12px,env(safe-area-inset-top));right:12px;display:flex;gap:8px}button{background:#ffffff19;border:1px solid #ffffff55;color:white;border-radius:30px;padding:10px 13px;font-size:16px;backdrop-filter:blur(10px)}.hint{position:fixed;bottom:max(22px,env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:#ffffffbd;font-size:14px;pointer-events:none;transition:opacity 1s;text-shadow:0 2px 9px #000}</style></head><body><canvas id="sky" aria-label="Touch a floating star and guide its glowing comet trail"></canvas><div class="controls"><button id="reset" aria-label="Choose another star">↺</button><button id="sound" aria-label="Toggle gentle sound">♪ Off</button><button id="full" aria-label="Fullscreen">⛶</button></div><div class="hint" id="hint">Choose a colorful star ✨</div><script>
const canvas=document.getElementById('sky'),ctx=canvas.getContext('2d');let w,h,dpr,dust=[],stars=[],particles=[],active=null,pointer=null,sound=false,audio,last=0,elapsed=0,glowUntil=0,bgDrift=0;const palette=['#ffe17b','#73ddff','#ff93d4','#ba9bff','#86f5bb','#ffad82'];const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function resize(){const ow=w||innerWidth,oh=h||innerHeight;w=innerWidth;h=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);dust=Array.from({length:Math.min(190,Math.round(w*h/2000))},()=>({x:rand(0,w),y:rand(0,h),r:rand(.4,1.7),a:rand(.22,.85),p:rand(0,7)}));if(!stars.length){const count=Math.min(10,Math.max(7,Math.round(w*h/49000)));for(let i=0;i<count;i++){const r=rand(22,33);stars.push({x:rand(r+15,Math.max(r+16,w-r-15)),y:rand(r+65,Math.max(r+66,h-r-40)),r,vx:rand(-.35,.35)||.2,vy:rand(-.3,.3)||.15,color:palette[i%palette.length],phase:rand(0,7)})}}else{for(const s of stars){s.x=clamp(s.x/ow*w,s.r+8,w-s.r-8);s.y=clamp(s.y/oh*h,s.r+8,h-s.r-8)}}}addEventListener('resize',resize);resize();
function pathStar(x,y,r){ctx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rad=i%2?r*.49:r,px=x+Math.cos(a)*rad,py=y+Math.sin(a)*rad;i?ctx.lineTo(px,py):ctx.moveTo(px,py)}ctx.closePath()}
function bg(t){bgDrift=t*.006;let g=ctx.createRadialGradient(w*.42,h*.46,5,w*.42,h*.46,Math.max(w,h)*.85);g.addColorStop(0,'#312364');g.addColorStop(.48,'#171945');g.addColorStop(1,'#080a24');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);for(const [x,y,c,shift] of [[.3,.38,'#b75ce7',0],[.7,.65,'#3e8fff',w*.5]]){const cx=((w*x-bgDrift+shift)%(w*1.6)+w*1.6)%(w*1.6)-w*.3;let n=ctx.createRadialGradient(cx,h*y,0,cx,h*y,Math.max(w,h)*.4);n.addColorStop(0,c+'20');n.addColorStop(1,c+'00');ctx.fillStyle=n;ctx.fillRect(0,0,w,h)}for(const d of dust){const x=((d.x-bgDrift)%(w+30)+(w+30))%(w+30)-15;ctx.globalAlpha=d.a*(.77+.23*Math.sin(t*.0012+d.p));ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,d.y,d.r,0,7);ctx.fill()}ctx.globalAlpha=1}
function drawStar(s,t,chosen=false){let r=s.r*(1+.035*Math.sin(t*.002+s.phase));const glowing=chosen&&t<glowUntil;ctx.save();ctx.shadowColor=s.color;ctx.shadowBlur=glowing?68:(chosen?30:20);ctx.fillStyle=s.color;pathStar(s.x,s.y,r*(glowing?1.06:1));ctx.fill();if(glowing){ctx.globalAlpha=.48;ctx.shadowBlur=45;ctx.strokeStyle='#fff';ctx.lineWidth=5;pathStar(s.x,s.y,r*1.17);ctx.stroke();ctx.globalAlpha=.25;ctx.beginPath();ctx.arc(s.x,s.y,r*1.55,0,Math.PI*2);ctx.fillStyle=s.color;ctx.fill();ctx.globalAlpha=1}ctx.shadowBlur=0;ctx.lineWidth=2;ctx.strokeStyle='#ffffffb8';pathStar(s.x,s.y,r);ctx.stroke();ctx.fillStyle='#252247';ctx.beginPath();ctx.arc(s.x-r*.2,s.y-r*.04,r*.055,0,7);ctx.arc(s.x+r*.2,s.y-r*.04,r*.055,0,7);ctx.fill();ctx.beginPath();ctx.arc(s.x,s.y+r*.10,r*.115,0,Math.PI);ctx.lineWidth=1.8;ctx.strokeStyle='#252247';ctx.stroke();ctx.restore()}
function emit(x,y,color,dx,dy,n=2){for(let i=0;i<n;i++){const a=rand(0,Math.PI*2),v=rand(.15,.9);particles.push({x:x+rand(-6,6),y:y+rand(-6,6),vx:Math.cos(a)*v-dx*.14,vy:Math.sin(a)*v-dy*.14,life:rand(17,39),max:39,r:rand(.8,3),color})}if(particles.length>280)particles.splice(0,particles.length-280)}
function trail(s){if(!s.history||s.history.length<2)return;const pts=s.history;ctx.save();ctx.lineCap='round';ctx.lineJoin='round';for(let layer=0;layer<3;layer++){ctx.beginPath();for(let i=0;i<pts.length;i++){const p=pts[i];i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)}ctx.strokeStyle=layer===0?s.color:layer===1?'#ffffff9e':'#ffffffdd';ctx.globalAlpha=layer===0?.3:layer===1?.6:.82;ctx.lineWidth=layer===0?39:layer===1?16:4;ctx.shadowBlur=layer===0?35:layer===1?20:8;ctx.shadowColor=s.color;ctx.stroke()}ctx.globalAlpha=1;for(let i=0;i<pts.length;i+=3){const p=pts[i],f=i/pts.length;ctx.globalAlpha=.13+f*.5;ctx.fillStyle=i%2?'#fff':s.color;ctx.shadowBlur=12;ctx.shadowColor=s.color;ctx.beginPath();ctx.arc(p.x+Math.sin(i*3.3+elapsed*.04)*(5+12*(1-f)),p.y+Math.cos(i*2.7+elapsed*.035)*(5+12*(1-f)),.7+f*2.2,0,7);ctx.fill()}ctx.restore()}
function frame(t){const dt=Math.min((t-last)/16.67||1,2);last=t;elapsed+=dt;bg(t);for(const s of stars){if(active||s===active)continue;s.x+=s.vx*dt;s.y+=s.vy*dt;if(s.x<s.r+8||s.x>w-s.r-8){s.vx*=-1;s.x=clamp(s.x,s.r+8,w-s.r-8)}if(s.y<s.r+10||s.y>h-s.r-10){s.vy*=-1;s.y=clamp(s.y,s.r+10,h-s.r-10)}drawStar(s,t)}if(active){const s=active;const px=s.x,py=s.y;if(pointer){s.x+=(pointer.x-s.x)*Math.min(.24*dt,1);s.y+=(pointer.y-s.y)*Math.min(.24*dt,1)}else{s.x+=s.vx*dt;s.y+=s.vy*dt;s.vx*=Math.pow(.992,dt);s.vy*=Math.pow(.992,dt);if(s.x<s.r+12||s.x>w-s.r-12){s.vx*=-1;s.x=clamp(s.x,s.r+12,w-s.r-12)}if(s.y<s.r+12||s.y>h-s.r-12){s.vy*=-1;s.y=clamp(s.y,s.r+12,h-s.r-12)}}const dx=s.x-px,dy=s.y-py;s.history??=[];s.history.push({x:s.x,y:s.y});if(s.history.length>40)s.history.shift();trail(s);if(Math.hypot(dx,dy)>.12&&Math.random()<.9)emit(s.x-dx*2,s.y-dy*2,s.color,dx,dy,2);drawStar(s,t,true)}for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;ctx.globalAlpha=clamp(p.life/p.max,0,1);ctx.shadowColor=p.color;ctx.shadowBlur=9;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();if(p.life<=0)particles.splice(i,1)}ctx.shadowBlur=0;ctx.globalAlpha=1;requestAnimationFrame(frame)}requestAnimationFrame(frame);
function chime(){if(!sound)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume?.();const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.setValueAtTime(rand(480,680),audio.currentTime);o.frequency.exponentialRampToValueAtTime(rand(700,950),audio.currentTime+.2);g.gain.setValueAtTime(.0001,audio.currentTime);g.gain.exponentialRampToValueAtTime(.035,audio.currentTime+.03);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+.42);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+.45)}catch(e){}}
function choose(x,y){if(active)return false;let closest=null,best=Infinity;for(const s of stars){const d=Math.hypot(x-s.x,y-s.y);if(d<best){best=d;closest=s}}if(!closest||best>closest.r+38)return false;if(active&&active!==closest){active.history=[];active.vx=rand(-.35,.35);active.vy=rand(-.35,.35)}active=closest;active.history=[];active.vx=.6;active.vy=.25;pointer={x,y};glowUntil=performance.now()+750;emit(active.x,active.y,active.color,0,0,25);chime();document.getElementById('hint').style.opacity='0';return true}
let dragging=false;canvas.addEventListener('pointerdown',e=>{if(active){glowUntil=performance.now()+750;emit(active.x,active.y,active.color,0,0,10);chime();dragging=true;pointer={x:e.clientX,y:e.clientY}}else{dragging=choose(e.clientX,e.clientY)}if(dragging)canvas.setPointerCapture?.(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(dragging&&active)pointer={x:clamp(e.clientX,active.r,w-active.r),y:clamp(e.clientY,active.r,h-active.r)}});function release(){if(dragging&&active){active.vx=clamp((active.history.at(-1)?.x-active.history.at(-5)?.x||2)*.2,-1.3,1.3);active.vy=clamp((active.history.at(-1)?.y-active.history.at(-5)?.y||1)*.2,-1.3,1.3)}dragging=false;pointer=null}canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);document.getElementById('reset').onclick=()=>{active=null;pointer=null;dragging=false;particles=[];document.getElementById('hint').textContent='Choose a colorful star ✨';document.getElementById('hint').style.opacity='1'};document.getElementById('sound').onclick=e=>{sound=!sound;e.currentTarget.textContent=sound?'♪ On':'♪ Off';if(sound)chime()};document.getElementById('full').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};
</script></body></html>
